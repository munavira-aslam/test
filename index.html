<html>
<head>
  <title>Products</title>
</head>
<body>
    <!--Tab to edit-->
  <div id="main_div"></div>

  <script>
    const products = [
      { name: "Apple Watch", price: 1200, image: "https://placehold.co/400" },
      { name: "Apple iPhone", price: 12000, image: "https://placehold.co/400" },
      { name: "Apple MacBook", price: 2400, image: "https://placehold.co/400" }
    ]; 

    const mainDiv = document.getElementById("main_div");

    for (let i = 0; i < products.length; i++) {
      // Create a container for each product
      const productDiv = document.createElement("div");

      // Create and append the product name
      const nameSpan = document.createElement("span");
      nameSpan.textContent = products[i].name;
      productDiv.appendChild(nameSpan);

      // Create and append the product price
      const priceSpan = document.createElement("span");
      priceSpan.textContent = "Price: $" + products[i].price;
      productDiv.appendChild(priceSpan);
      
      const buyButton=document. createElement('button');
      buyButton. textContent='Buy now';
      productDiv. appendChild(buyButton);

      // Create and append the product image
      const img = document.createElement("img");
      img.src = products[i].image;
      img.alt = products[i].name;
      img.style.width = "150px"; // Adjust the image size as needed
      productDiv.appendChild(img);

      // Append the productDiv to the main div
      mainDiv.appendChild(productDiv);
      
    }
  </script>
</body>
</html>
